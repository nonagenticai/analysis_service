[project]
license = "Apache-2.0"
name = "analysis-service"
version = "0.1.0"
description = "Unified website analysis microservice (critique, review, brand extraction, content analysis, redesign)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # --- Core framework ---
    "fastapi[all]>=0.135.0",

    "uvicorn[standard]>=0.41.0",

    "pydantic>=2.12.0",

    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j fixed in 2.14.2

    "python-dotenv>=1.2.0",

    "jinja2>=3.1.6",

    # --- Database ---
    "psycopg[binary,pool]>=3.3.0",

    "sqlalchemy[asyncio]>=2.0.48",

    "alembic>=1.18.0",

    # --- Redis ---
    "redis>=7.3.0",

    # --- HTTP / networking ---
    "httpx>=0.28.0",

    # --- HTML parsing ---
    # <4.15: 4.15.0 retyped Tag.find/find_all overloads so attrs={...}/string=... calls
    # (valid at runtime) fail ty with 22 invalid-argument-type errors. Lift once fixed upstream.
    "beautifulsoup4>=4.14.0,<4.16",

    "lxml>=6.1.0",

    # --- PDF / rendering ---
    # Floor is load-bearing: <70.0 is PYSEC-2026-3940 / CVE-2026-55073 /
    # GHSA-jf6q-chmf-3h3v, an SSRF in the HTML->PDF fetcher (published
    # 2026-09-10, affected range "introduced: 0" -> "fixed: 70.0"). This
    # service renders caller-supplied site HTML, so the fetcher is on a
    # caller-reachable path. A `>=68.0` floor lets a future `uv lock` walk
    # back into the vulnerable range with pip-audit still green, because
    # pip-audit audits the LOCK, not the floor.
    "weasyprint>=70.0",

    "playwright>=1.58.0",

    # --- Image / media ---
    "pillow>=13.0.0",

    "numpy>=2.4.0",

    # --- Object storage (via w2v_common.storage facade) ---
    "miniopy-async>=1.23.0",
    # --- Observability ---
    "prometheus-client>=0.24.0",

    "structlog>=25.5.0",

    "opentelemetry-api>=1.45.2",

    "opentelemetry-sdk>=1.40.0",

    "opentelemetry-instrumentation-fastapi>=0.61b0",

    "opentelemetry-instrumentation-httpx>=0.61b0",

    "opentelemetry-exporter-otlp>=1.40.0",

    # --- Misc ---
    "cachetools>=7.0.0",

    # Floor is load-bearing, not cosmetic: src/shared/security/playwright_guard.py
    # imports `validate_public_url` from w2v_common.net, and w2v_common < 0.51.0
    # is FAIL-OPEN on that call. A lock resolving anything older would install a
    # guard that silently approves everything. 0.54.0 is what is locked today.
    "w2v-common>=0.106.0",  # + clients.webscraper (KAG removal); auth.entitlement (0.75.0)

    # --- Security floors on transitive dependencies ---
    # Neither of these is imported by this service directly; both arrive through
    # other pins — aiohttp via miniopy-async and aiohttp-retry, cryptography via
    # pyjwt and w2v-common. #176 already moved the LOCK to safe versions; these
    # floors are what stop it drifting back. A lock is a point-in-time
    # resolution, so the next unrelated `uv lock` is free to walk an undeclared
    # transitive down again. The declared floor is the only thing that binds it.
    #
    # aiohttp 3.14.1 was flagged by CVE-2026-59881 + CVE-2026-69243 (fixed in
    # 3.14.2) and CVE-2026-69244 (fixed in 3.14.3); 3.14.3 clears all three.
    # 3.14.3 is in turn flagged by CVE-2026-111063 + CVE-2026-111064 +
    # GHSA-2g87-pp6c-29x5 (fixed in 3.14.4).
    "aiohttp>=3.14.4",
    # cryptography: CVE-2026-69247 (GHSA-g6cj-pr64-35w5) was introduced in
    # 44.0.0 and fixed in 50.0.0, so the previously-locked 49.0.0 was affected.
    "cryptography>=50.0.0",
]

[project.scripts]
analysis-service = "src.asgi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",

    "pytest-asyncio>=1.3.0",

    "pytest-cov>=7.0.0",

    "pytest-timeout>=2.4.0",

    "pytest-xdist>=3.6.0",

    "pytest-rerunfailures>=15.0",

    "pytest-mock>=3.15.0",

    "httpx>=0.28.0",
    "ruff>=0.15.0",

    # <0.0.41: ty 0.0.41+ adds rules (create_app arg, sum overload, mixin attribute overrides, @asynccontextmanager AsyncIterator deprecation) that flag ~21 sites.
    # Dev-only type checker, no runtime/pip-audit impact; lift when the code is migrated.
    "ty>=0.0.23,<0.0.108",

    "fakeredis>=2.34.0",

    "pip-audit>=2.10.0",
    # Transitive via pip-audit -> pip-api -> pip. PYSEC-2026-3721 affects
    # pip < 26.2; declared explicitly so a future `uv lock` cannot walk the
    # lock back into the vulnerable range with pip-audit still green.
    "pip>=26.2",

    "detect-secrets>=1.5.0",
    "bandit>=1.9.4",
]

[tool.uv]
override-dependencies = [
    "pycairo; sys_platform == 'never'",
    # miniopy-async (1.23.5, the LATEST) caps the CA-certificate bundle:
    #   certifi>=2025.1.31,<2026.0.0
    # That is lazy upper-bounding, not a real incompatibility -- certifi's entire
    # public API is where()/contents() and has been stable for years, while the
    # package's whole purpose is to ship CURRENT roots. Left alone the cap pins
    # every MinIO-using repo in this fleet to a trust store from Nov 2025, and no
    # relock cadence can move it (verified by making uv name the constraint).
    #
    # NOT overriding miniopy-async's argon2-cffi<24.0.0 alongside it: that is a
    # MAJOR bump with real API surface, so it needs its own testing rather than
    # riding along with a data-only package.
    "certifi>=2026.7.22",
]

[tool.uv.sources]
# The published source tree resolves its shared library from the public
# repository at the release tag; the private index is not reachable here.
w2v-common = { git = "https://github.com/nonagenticai/w2v_common", tag = "v0.115.4" }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "ANN", "B", "BLE", "A", "S", "C901",
    "RUF", "RET", "SIM", "ASYNC", "PTH",
]
ignore = [
    "E501",
    "B008",
    "ANN401",
    # ASYNC240 (pathlib in async) requires anyio.Path refactor across
    # production async paths; tracked as fleet-wide follow-up. Stat
    # calls in async handlers are microsecond-fast, not a hotspot today.
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
"src/database/migrations/*" = ["I001", "ANN"]
"src/asgi.py" = ["E402"]
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "S108", "ANN", "PTH", "ASYNC230", "ASYNC240", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# The large DB-heavy suite ran >2h serially and blew the CI job timeout, so it never
# promoted. Parallelise it: -n 4 (the suite is DB-bound and saturates ~4 workers) with
# per-worker schema isolation (tests/conftest.py db_engine). Bounded reruns absorb the
# residual transient parallel-load / concurrency-race flakes in the real_db tests.
# --timeout is a safety net: a stranded Postgres lock (plain lock waits never time out
# in PG) must FAIL LOUD with a stack dump, not hang the pre-commit hook forever.
addopts = "-n 4 --reruns 2 --reruns-delay 1 --timeout=120 --timeout-method=thread"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    # The ONLY DB-level proof that the RLS policies isolate tenants. Needs a
    # superuser/CREATEROLE test DB; skips (loudly — see tests/test_rls_isolation.py)
    # otherwise. Run `pytest -m rls_db_proof` against such a DB before trusting
    # any RLS change.
    "rls_db_proof: DB-level RLS isolation proof; requires CREATEROLE",
]
filterwarnings = [
    "ignore:coroutine '.*AsyncMockMixin._execute_mock_call.*' was never awaited:RuntimeWarning",
    "ignore:coroutine '.*_deliver_webhook.*' was never awaited:RuntimeWarning",
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
]

[tool.coverage.run]
omit = [
    "src/database/migrations/*",
    "src/asgi.py",
]

[tool.coverage.report]
omit = [
    "src/database/migrations/*",
    "src/asgi.py",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
unresolved-import = "error"
unresolved-reference = "error"
unresolved-attribute = "error"
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
missing-argument = "error"
invalid-argument-type = "error"
invalid-return-type = "error"

# Optional vendor deps (GPU libs, optional PDF backends, optional OTel extras)
# aren't in the prod lockfile; ty rightly can't resolve them. Scope the
# unresolved-import suppression narrowly to the import sites instead of
# scattering source-level `# ty: ignore[unresolved-import]` comments.
[[tool.ty.overrides]]
include = [
    "src/domains/redesign/services/flux_image_generator.py",
    "src/domains/critique/services/pdf_generator.py",
    "src/shared/observability/tracing.py",
    "src/observability/tracing.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "src/database/migrations"]
skips = ["B101", "B104", "B112", "B311"]
